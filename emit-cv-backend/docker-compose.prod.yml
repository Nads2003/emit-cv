# Surcouche HTTPS : Caddy obtient et renouvelle automatiquement les certificats Let's Encrypt.
# Prérequis : DOMAINE=cv.votre-ecole.mg pointant vers ce serveur (enregistrement DNS A) ; ports 80 et 443 ouverts.
services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAINE: ${DOMAINE:?définir DOMAINE dans .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificats : à conserver
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped
  frontend:
    ports: !reset []            # le frontend n'est plus exposé directement : tout passe par Caddy (HTTPS)
volumes:
  caddy_data:
  caddy_config:
